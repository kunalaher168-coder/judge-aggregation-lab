name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,llm]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Published benchmark is reproducible
        if: matrix.python-version == '3.12'
        run: |
          judgelab benchmark --seeds 20 --items 400 --out-md /tmp/benchmark.md > /dev/null
          diff -u results/benchmark.md /tmp/benchmark.md
      - name: Simulated multi-agent run (no API key needed)
        if: matrix.python-version == '3.12'
        run: |
          judgelab judge --items data/support/items.jsonl --rubric data/support/rubric.md \
            --truth data/support/truth.jsonl --backend simulated --out-dir /tmp/sim

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t judgelab .
      - name: Run tests in the image
        run: docker run --rm judgelab
